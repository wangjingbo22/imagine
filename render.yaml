services:
  - type: web
    name: xingzhi-travel-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: AMAP_WEB_SERVICE_KEY
        sync: false
      - key: BAILIAN_API_KEY
        sync: false
      - key: BAILIAN_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: BAILIAN_MODEL
        value: qwen3.7-plus
      - key: BAILIAN_REQUEST_TIMEOUT_SECONDS
        value: 45
      - key: BAILIAN_EXECUTION_EVENT_TIMEOUT_SECONDS
        value: 10
      - key: BAILIAN_REPLAN_EXPLANATION_TIMEOUT_SECONDS
        value: 10
      - key: CORS_ALLOWED_ORIGINS
        value: https://imagine-1-31o2.onrender.com
      - key: PLAN_VERSION_DB_PATH
        value: /app/data/plan_versions.sqlite3
      - key: AMAP_CACHE_DB_PATH
        value: /app/data/amap_cache.sqlite3

  - type: web
    name: xingzhi-travel-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /health
    envVars:
      - key: API_UPSTREAM
        value: https://imagine-mp7v.onrender.com
