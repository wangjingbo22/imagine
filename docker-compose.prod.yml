services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      AMAP_BASE_URL: ${AMAP_BASE_URL:-https://restapi.amap.com}
      AMAP_REQUEST_TIMEOUT_SECONDS: ${AMAP_REQUEST_TIMEOUT_SECONDS:-8}
      AMAP_CACHE_DB_PATH: /app/data/amap_cache.sqlite3
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      ACCOUNT_API_KEY_ENCRYPTION_KEY: ${ACCOUNT_API_KEY_ENCRYPTION_KEY:?ACCOUNT_API_KEY_ENCRYPTION_KEY is required for account-bound model keys}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen-plus}
      BAILIAN_REQUEST_TIMEOUT_SECONDS: ${BAILIAN_REQUEST_TIMEOUT_SECONDS:-45}
      BAILIAN_EXECUTION_EVENT_TIMEOUT_SECONDS: ${BAILIAN_EXECUTION_EVENT_TIMEOUT_SECONDS:-10}
      BAILIAN_REPLAN_EXPLANATION_TIMEOUT_SECONDS: ${BAILIAN_REPLAN_EXPLANATION_TIMEOUT_SECONDS:-10}
      PLAN_VERSION_DB_PATH: /app/data/plan_versions.sqlite3
      ACCOUNT_SESSION_DB_PATH: /app/data/account.sqlite3
      APP_ENVIRONMENT: production
      AUTH_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    volumes:
      - xingzhi-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_USE_MOCK_API: "false"
        VITE_USE_PLAN_VERSION_API: "true"
        VITE_USE_WORKFLOW_API: "true"
    depends_on:
      - backend
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  xingzhi-data:
