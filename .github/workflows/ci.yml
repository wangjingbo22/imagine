name: Sprint 3 quality gate

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"
      - name: Run S3-T003 backend quality gate
        run: python tools/s3_t003_quality_gate.py

      - name: Upload S3-T003 quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-t003-quality-reports
          path: .quality-reports/s3-t003/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:t024
      - working-directory: frontend
        run: npm run test:segment-route-preferences
